<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#74203a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>BeauDesk Admin</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: #2b0a16;
        background:
          radial-gradient(circle at 15% 10%, #f8e4e9 0, transparent 40%),
          radial-gradient(circle at 90% 90%, #fff2c6 0, transparent 35%),
          #fbf6f7;
      }
      main {
        width: 100%;
        max-width: 440px;
        padding: 36px 32px;
        text-align: center;
        background: #fff;
        border: 1px solid #f8e4e9;
        border-radius: 28px;
        box-shadow: 0 2px 6px rgb(43 10 22 / 0.06), 0 24px 48px -20px rgb(43 10 22 / 0.35);
      }
      img { display: block; height: 30px; width: auto; margin: 0 auto; }
      .badge {
        display: inline-block;
        margin-top: 28px;
        padding: 6px 12px;
        border-radius: 999px;
        background: #ffcb2b;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      h1 { margin-top: 14px; font-size: 26px; letter-spacing: -0.02em; }
      p { margin-top: 10px; font-size: 15px; line-height: 1.6; color: #6b5b60; }
      a {
        display: inline-block;
        margin-top: 26px;
        padding: 13px 22px;
        border-radius: 16px;
        background: #74203a;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover { background: #5d1a2f; }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/beaudesk-logo.png" alt="BeauDesk" width="263" height="38" />
      <span class="badge">Staff area</span>
      <h1>Admin is coming soon</h1>
      <p>The BeauDesk dashboard for bookings, tokens and dues is being set up. Customers can keep booking on the main site.</p>
      <a href="https://beaudesk.web.app">Go to BeauDesk</a>
    </main>
  </body>
</html>
